name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./public/manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match manifest version $version"
            exit 1
          fi

      - name: Zip dist
        run: |
          cd dist
          zip -r "../pointmark-${GITHUB_REF_NAME}.zip" .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pointmark-*.zip --title "$GITHUB_REF_NAME" --generate-notes
